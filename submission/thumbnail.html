<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0}
body{width:1800px;height:1200px;background:#f4efe4;background-image:radial-gradient(rgba(120,100,60,.10) 2px,transparent 2px);background-size:44px 44px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;color:#1d2721;display:grid;grid-template-columns:1fr 760px;align-items:center;overflow:hidden}
.left{padding:0 0 0 120px}
.brand{display:flex;align-items:center;gap:26px;font-size:64px;font-weight:600}
.brand svg{width:104px;height:104px}
h1{font-size:112px;line-height:1.04;margin:56px 0 0;font-weight:600;letter-spacing:-.01em}
p{font:500 40px/1.35 system-ui,-apple-system,'Segoe UI',sans-serif;color:#5f665c;margin:36px 0 0;max-width:820px}
.pill{display:inline-flex;align-items:center;gap:16px;margin-top:48px;border:2px solid #d8d0bd;background:#fffdf7;border-radius:999px;padding:16px 32px 16px 24px;font:600 32px system-ui,-apple-system,sans-serif}
.dot{width:20px;height:20px;border-radius:50%;background:#2a6a3f;box-shadow:0 0 0 7px rgba(42,106,63,.2)}
.receipt{background:#fffdf7;width:600px;padding:56px 56px 76px;box-shadow:0 30px 70px -30px rgba(40,30,10,.5);transform:rotate(3deg);-webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 20px) no-repeat,radial-gradient(circle at 16px 0,#000 14px,transparent 15px) bottom left/32px 20px repeat-x}
.eyebrow{font:600 22px ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.14em;color:#5f665c}
.big{font:700 168px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:-.04em;color:#a84d24;margin-top:14px}
.after{font-size:46px;font-weight:600;margin-top:6px}
.row{display:flex;justify-content:space-between;font:500 28px ui-monospace,'SF Mono',Menlo,monospace;border-top:2px dashed #d8d0bd;padding:18px 0 0;margin-top:18px}
.row b{color:#a84d24}
</style></head><body>
<div class="left">
  <div class="brand"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#a84d24"/><circle cx="20" cy="20" r="12.5" fill="none" stroke="#fffdf7" stroke-width="1.2" stroke-dasharray="1.5 2.2"/><path d="M24.5 15.5a6 6 0 1 0 0 9M20 11v18" fill="none" stroke="#fffdf7" stroke-width="2.6" stroke-linecap="round"/></svg>Loose Change</div>
  <h1>Find the money that leaves quietly.</h1>
  <p>An AI model reads your bank statement inside your own browser tab.</p>
  <div class="pill"><span class="dot"></span>Runs on your device. Nothing is uploaded.</div>
</div>
<div class="receipt">
  <div class="eyebrow">WHAT YOUR STATEMENT SAYS</div>
  <div class="big">$791</div>
  <div class="after">a year of loose change</div>
  <div class="row"><span>Charged twice</span><b>$54.35</b></div>
  <div class="row"><span>Prices went up</span><b>+$306/yr</b></div>
  <div class="row"><span>Bank fees</span><b>$431/yr</b></div>
  <div class="row"><span>Trial became paid</span><b>$276/yr</b></div>
</div>
</body></html>
